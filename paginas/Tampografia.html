
<head>
    <meta charset="UTF-8">
    <title>Salidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/paginas/Tampo/Tampo.css" rel="stylesheet">
    <style>
        @media (max-width: 768px) {
    .container {
        padding: 0 12px;
    }

    h2 {
        font-size: 1.3rem;
    }

    h3 {
        font-size: 1.1rem;
    }

    /* Tabla con scroll horizontal en móvil */
    .table-responsive-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Inputs y botón full width */
    .form-control,
    .form-select,
    .btn {
        font-size: 1rem;
        height: 48px; /* más fácil de tocar con el dedo */
    }

    .btn-success {
        width: 100%;
        margin-top: 8px;
    }

    /* Dropdown de sugerencias */
    #sugerenciasBox {
        width: 90vw;
    }
}
        /* Dropdown de sugerencias */
        #sugerenciasBox {
            position: fixed;
            z-index: 1000;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0 0 6px 6px;
            width: 400px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }
        #sugerenciasBox .sug-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #sugerenciasBox .sug-item:hover {
            background-color: #f0f4ff;
        }
        #sugerenciasBox .sug-codigo {
            font-weight: 600;
            color: #0d6efd;
        }
        #sugerenciasBox .sug-nombre {
            color: #555;
        }
        .input-wrapper {
            position: relative;
        }
    </style>
</head>

<div class="container mt-4">

    <!-- ✅ Título y descripción -->
    <div class="mb-4">
        <h2 class="mb-1">Registro de Salidas</h2>
        <p class="text-muted mb-0">
            Escanea o busca un producto para registrar su salida del almacén.
            Puedes usar el lector de código de barras o escribir el nombre/código manualmente.
        </p>
        <hr>
    </div>

    <!-- ✅ Input con autocomplete -->
    <div class="input-wrapper mb-3">
        <input
            type="text"
            id="scannerInput"
            class="form-control"
            placeholder="Escanea código o escribe nombre/código"
            autofocus
            autocomplete="off"
        >
        <div id="sugerenciasBox"></div>
    </div>

    <div class="card p-3">
        <h4 id="nombreProducto">Producto</h4>
        <p>Código: <span id="codigoProducto"></span></p>
        <p>Ubicación: <span id="ubicacionProducto"></span></p>
    </div>

    <h3 class="mt-4">Productos escaneados</h3>
<div class="table-responsive-wrapper"> 
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody id="tbodySalidas"></tbody>
    </table>
</div>  <!-- ← cierra aquí -->
    <input type="text" id="solicitadoPor" class="form-control mb-3" placeholder="Solicitado por">
    <input type="text" id="maquina" class="form-control mb-3" placeholder="Máquina (Ej. Aoki 500, Tampografía 2, ASB 70DPH)">

    <label class="mb-1">Entregado por</label>
    <select id="entregadoPor" class="form-select mb-3">
        <option value="Miguel">Miguel</option>
        <option value="Brandon">Brandon</option>
        <option value="Alexis">Alexis</option>
    </select>

    <input
    type="text"
    id="notaSalida"
    class="form-control mb-3"
    placeholder="Nota o título de la salida (opcional)"
    >

    <button class="btn btn-success" onclick="guardarTodas()">
        Guardar Todas las Salidas
    </button>
</div>
<script src="../js/pagJs/tampo/tampografia.js"></script>
