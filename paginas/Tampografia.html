<div class="container mt-4">

    <h2>Registro de Salidas</h2>

    <input
        type="text"
        id="scannerInput"
        class="form-control mb-3"
        placeholder="Escanea código"
        autofocus
    >

    <div class="card p-3">

        <h4 id="nombreProducto">

            Producto

        </h4>

        <p>

            Código:
            <span id="codigoProducto"></span>

        </p>

        <p>

            Ubicación:
            <span id="ubicacionProducto"></span>

        </p>

    </div>

    <h3 class="mt-4">

        Productos escaneados

    </h3>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Código</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Eliminar</th>

            </tr>

        </thead>

        <tbody id="tbodySalidas">

        </tbody>

    </table>

    <input
        type="text"
        id="solicitadoPor"
        class="form-control mb-3"
        placeholder="Solicitado por"
    >

    <label class="mb-1">

        Entregado por

    </label>

    <select
        id="entregadoPor"
        class="form-select mb-3"
    >

        <option value="Miguel">
            Miguel
        </option>

        <option value="Brandon">
            Brandon
        </option>

        <option value="Alexis">
            Alexis
        </option>

    </select>

    <button
        class="btn btn-success"
        onclick="guardarTodas()"
    >

        Guardar Todas las Salidas

    </button>

</div>

<script src="../js/pagJs/tampo/tampografia.js"></script>
