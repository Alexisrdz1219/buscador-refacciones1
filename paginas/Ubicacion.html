<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Asignar Ubicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/paginas/Tampo/Tampo.css">
    <style>
        #sugerenciasBox {
            position: fixed;
            z-index: 1000;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0 0 6px 6px;
            width: 400px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }
        #sugerenciasBox .sug-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #sugerenciasBox .sug-item:hover { background-color: #f0f4ff; }
        .sug-codigo { font-weight: 600; color: #0d6efd; }
        .sug-nombre { color: #555; }
        .input-wrapper { position: relative; }

        @media (max-width: 600px) {
            #sugerenciasBox { width: 90vw; }
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="mb-4">
        <h2 class="mb-1">Asignar Ubicación</h2>
        <p class="text-muted mb-0">
            Escribe la ubicación, escanea las refacciones y guarda.
        </p>
        <hr>
    </div>

    <!-- Ubicación -->
    <label class="mb-1">Ubicación</label>
    <input
        type="text"
        id="inputUbicacion"
        class="form-control mb-3"
        placeholder="Ej. A1 C2-N3"
        autocomplete="off"
    >

    <!-- Scanner -->
    <div class="input-wrapper mb-3">
        <input
            type="text"
            id="scannerInput"
            class="form-control"
            placeholder="Escanea código o escribe nombre/código"
            autocomplete="off"
        >
        <div id="sugerenciasBox"></div>
    </div>

    <!-- Tabla de refacciones escaneadas -->
    <h3 class="mt-3">Refacciones a actualizar</h3>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Producto</th>
                    <th>Ubicación actual</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody id="tbodyUbicacion"></tbody>
        </table>
    </div>

    <button class="btn btn-success mt-2" onclick="guardarUbicaciones()">
        Guardar Ubicaciones
    </button>

</div>

<script src="../js/pagJs/tampo/ubicacion.js"></script>

</body>
</html>
